from flask import Flask, request, jsonify, render_template
from flask_cors import CORS
import sqlite3
import smtplib
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart
from datetime import datetime
import os

app = Flask(__name__)
CORS(app)

# ─── CONFIG ──────────────────────────────────────────────────────────────────
SMTP_HOST     = "smtp.office365.com"
SMTP_PORT     = 587
SMTP_USER     = "your@yourcompany.com"  # ← your Outlook/Microsoft email
SMTP_PASSWORD = "your_password"         # ← your Outlook/Microsoft password
COMPANY_NAME  = "Your Company"
DB_PATH       = "leads.db"

# ─── DATABASE SETUP ──────────────────────────────────────────────────────────
def init_db():
    conn = sqlite3.connect(DB_PATH)
    conn.execute("""
        CREATE TABLE IF NOT EXISTS leads (
            id        INTEGER PRIMARY KEY AUTOINCREMENT,
            name      TEXT NOT NULL,
            email     TEXT NOT NULL,
            phone     TEXT,
            message   TEXT,
            source    TEXT DEFAULT 'website',
            status    TEXT DEFAULT 'new',
            created_at TEXT NOT NULL
        )
    """)
    conn.commit()
    conn.close()

def save_lead(name, email, phone, message):
    conn = sqlite3.connect(DB_PATH)
    conn.execute(
        "INSERT INTO leads (name, email, phone, message, created_at) VALUES (?,?,?,?,?)",
        (name, email, phone, message, datetime.now().isoformat())
    )
    conn.commit()
    conn.close()

def get_all_leads():
    conn = sqlite3.connect(DB_PATH)
    conn.row_factory = sqlite3.Row
    rows = conn.execute("SELECT * FROM leads ORDER BY created_at DESC").fetchall()
    conn.close()
    return [dict(r) for r in rows]

# ─── EMAIL ───────────────────────────────────────────────────────────────────
def send_auto_reply(to_email, to_name, customer_message):
    """Send automated reply to the customer."""
    msg = MIMEMultipart("alternative")
    msg["Subject"] = f"Thanks for reaching out, {to_name}!"
    msg["From"]    = SMTP_USER
    msg["To"]      = to_email

    html_body = f"""
    <html><body style="font-family:Arial,sans-serif;color:#333;max-width:600px;margin:auto;padding:20px">
      <h2 style="color:#2563eb">{COMPANY_NAME}</h2>
      <p>Hi <strong>{to_name}</strong>,</p>
      <p>Thank you for contacting us! We've received your message and our team will
         get back to you within <strong>24 hours</strong>.</p>
      <blockquote style="border-left:4px solid #2563eb;padding:10px 15px;background:#f1f5f9;color:#555">
        {customer_message}
      </blockquote>
      <p>Best regards,<br/><strong>{COMPANY_NAME} Team</strong></p>
    </body></html>
    """
    msg.attach(MIMEText(html_body, "html"))

    with smtplib.SMTP(SMTP_HOST, SMTP_PORT) as server:
        server.starttls()
        server.login(SMTP_USER, SMTP_PASSWORD)
        server.sendmail(SMTP_USER, to_email, msg.as_string())

def notify_team(name, email, phone, message):
    """Notify your internal team about the new lead."""
    msg = MIMEMultipart()
    msg["Subject"] = f"🔔 New Lead: {name}"
    msg["From"]    = SMTP_USER
    msg["To"]      = SMTP_USER   # ← change to your team inbox

    body = f"""New lead received!\n
Name:    {name}
Email:   {email}
Phone:   {phone or 'N/A'}
Message: {message}
Time:    {datetime.now().strftime('%Y-%m-%d %H:%M')}
"""
    msg.attach(MIMEText(body, "plain"))
    with smtplib.SMTP(SMTP_HOST, SMTP_PORT) as server:
        server.starttls()
        server.login(SMTP_USER, SMTP_PASSWORD)
        server.sendmail(SMTP_USER, SMTP_USER, msg.as_string())

# ─── ROUTES ──────────────────────────────────────────────────────────────────
@app.route("/")
def index():
    return render_template("index.html", company=COMPANY_NAME)

@app.route("/submit-lead", methods=["POST"])
def submit_lead():
    data    = request.get_json()
    name    = data.get("name", "").strip()
    email   = data.get("email", "").strip()
    phone   = data.get("phone", "").strip()
    message = data.get("message", "").strip()

    if not name or not email or not message:
        return jsonify({"success": False, "error": "Name, email and message are required."}), 400

    # 1. Save to database
    save_lead(name, email, phone, message)

    # 2. Auto-reply to customer
    try:
        send_auto_reply(email, name, message)
    except Exception as e:
        print(f"[Email Error] Auto-reply failed: {e}")

    # 3. Notify team
    try:
        notify_team(name, email, phone, message)
    except Exception as e:
        print(f"[Email Error] Team notification failed: {e}")

    return jsonify({"success": True, "message": "Thank you! We'll be in touch soon."})

@app.route("/leads")          # Simple admin view
def leads():
    all_leads = get_all_leads()
    return jsonify(all_leads)

# ─── MAIN ────────────────────────────────────────────────────────────────────
if __name__ == "__main__":
    init_db()
    print("✅ Lead capture server running at http://localhost:5000")
    app.run(debug=True)